<!DOCTYPE html><html><head><title>GigogFlix by iis-gigog - V10 POSTER</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;margin:0}.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{font-size:26px;font-weight:900;color:#FFD700}.search{padding:8px 12px;border-radius:20px;border:none;background:#222;color:#fff;width:130px}.hero{text-align:center;padding:18px}.hero h1{color:#e50914;font-size:26px;margin:0}.hero p{color:#aaa;font-size:11px;margin-top:4px}.cats{display:flex;gap:8px;overflow:auto;padding:12px}.cats button{background:#222;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:12px;white-space:nowrap}.cats button.active{background:#e50914}.movies{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.movie{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #2a2a2a}.poster{width:100%;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;box-sizing:border-box}.icon{font-size:42px;margin-bottom:8px}.title{font-weight:900;font-size:16px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,0.8)}.sub{font-size:9px;margin-top:6px;opacity:0.8;letter-spacing:1px}.movie h3{font-size:12px;margin:8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movie p{font-size:10px;color:#888;margin:0 6px 6px}.btns{display:flex;gap:5px;padding:0 6px 10px}.btns button{flex:1;background:#e50914;color:#fff;border:none;padding:9px;border-radius:6px;font-size:12px;font-weight:bold}.btns button.s{background:#333}#player{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999}#player iframe{width:100%;height:85%;margin-top:50px;border:none}.top{position:absolute;top:0;left:0;width:100%;background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;box-sizing:border-box}.footer{text-align:center;padding:25px;color:#555;font-size:11px}</style></head><body><div class="header"><div class="logo">GIGOGFLIX</div><input id="search" class="search" placeholder="Cari..." onkeyup="filterFilms()"></div><div class="hero"><h1>Nonton Gratis</h1><p>by iis-gigog - V10 Poster Sesuai Judul</p></div><div class="cats"><button class="active" onclick="filterCat('all',this)">Semua</button><button onclick="filterCat('Action',this)">Action</button><button onclick="filterCat('Horror',this)">Horror</button><button onclick="filterCat('Comedy',this)">Comedy</button><button onclick="filterCat('Drama',this)">Drama</button></div><div class="movies" id="movies"></div><div id="player"><div class="top"><b id="pTitle"></b><button onclick="closePlayer()" style="background:#e50914;color:#fff;border:none;padding:6px 12px;border-radius:5px">✕ Tutup</button></div><iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe></div><div class="footer">© 2026 GigogFlix by iis-gigog - V10</div><script>let films=[{name:"Avengers Endgame",cat:"Action",yt:"TcMBFSGVi1c",icon:"🦸",bg:"linear-gradient(135deg,#7b0000,#ff0000)",sub:"FINAL BATTLE"},{name:"John Wick 4",cat:"Action",yt:"TcMBFSGVi1c",icon:"🔫",bg:"linear-gradient(135deg,#000,#333)",sub:"NO MORE RULES"},{name:"Spider-Man No Way Home",cat:"Action",yt:"TcMBFSGVi1c",icon:"🕷️",bg:"linear-gradient(135deg,#cc0000,#001a66)",sub:"MULTIVERSE"},{name:"The Batman",cat:"Action",yt:"TcMBFSGVi1c",icon:"🦇",bg:"linear-gradient(135deg,#111,#444)",sub:"VENGEANCE"},{name:"Top Gun Maverick",cat:"Action",yt:"TcMBFSGVi1c",icon:"✈️",bg:"linear-gradient(135deg,#ff6600,#ffcc00)",sub:"FEEL THE NEED"},{name:"Fast X",cat:"Action",yt:"TcMBFSGVi1c",icon:"🏎️",bg:"linear-gradient(135deg,#222,#666)",sub:"LAST RIDE"},{name:"KKN Desa Penari",cat:"Horror",yt:"TcMBFSGVi1c",icon:"👻",bg:"linear-gradient(135deg,#000,#1a0000)",sub:"KUTUKAN DESA"},{name:"Pengabdi Setan 2",cat:"Horror",yt:"TcMBFSGVi1c",icon:"💀",bg:"linear-gradient(135deg,#000,#330000)",sub:"COMING HOME"},{name:"The Conjuring 2",cat:"Horror",yt:"TcMBFSGVi1c",icon:"🕯️",bg:"linear-gradient(135deg,#0a0a0a,#2a0000)",sub:"ENFIELD"},{name:"Sewu Dino",cat:"Horror",yt:"TcMBFSGVi1c",icon:"🏚️",bg:"linear-gradient(135deg,#001100,#000)",sub:"1000 HARI"},{name:"Agak Laen",cat:"Comedy",yt:"TcMBFSGVi1c",icon:"😂",bg:"linear-gradient(135deg,#ffd700,#ff8c00)",sub:"FOUR FRIENDS"},{name:"Cek Toko Sebelah",cat:"Comedy",yt:"TcMBFSGVi1c",icon:"🏪",bg:"linear-gradient(135deg,#ffcc00,#ff6600)",sub:"KELUARGA"},{name:"Miracle Cell No 7",cat:"Drama",yt:"TcMBFSGVi1c",icon:"👨‍👧",bg:"linear-gradient(135deg,#0066ff,#00ccff)",sub:"AYAH & ANAK"},{name:"Dilan 1990",cat:"Drama",yt:"TcMBFSGVi1c",icon:"🏍️",bg:"linear-gradient(135deg,#6600cc,#ff3399)",sub:"CINTA & SENJA"},{name:"Habibie Ainun",cat:"Drama",yt:"TcMBFSGVi1c",icon:"❤️",bg:"linear-gradient(135deg,#ff0066,#ff9966)",sub:"KISAH CINTA"},{name:"The Raid",cat:"Action",yt:"TcMBFSGVi1c",icon:"👊",bg:"linear-gradient(135deg,#990000,#000)",sub:"SERBUAN MAUT"},{name:"Warkop DKI",cat:"Comedy",yt:"TcMBFSGVi1c",icon:"🤣",bg:"linear-gradient(135deg,#ffdd00,#ff8800)",sub:"REBORN"},{name:"Danur",cat:"Horror",yt:"TcMBFSGVi1c",icon:"👧",bg:"linear-gradient(135deg,#000,#220044)",sub:"TEMAN TAK KASAT"},{name:"Laskar Pelangi",cat:"Drama",yt:"TcMBFSGVi1c",icon:"🌈",bg:"linear-gradient(135deg,#00aa66,#66ffcc)",sub:"MIMPI"},{name:"Gundala",cat:"Action",yt:"TcMBFSGVi1c",icon:"⚡",bg:"linear-gradient(135deg,#cc0000,#000066)",sub:"PATRIOT"}];let curCat='all';function render(f){let h=document.getElementById('movies');h.innerHTML='';f.forEach(m=>{let i=films.indexOf(m);h.innerHTML+=`<div class="movie"><div class="poster" style="background:${m.bg}"><div class="icon">${m.icon}</div><div class="title">${m.name.toUpperCase()}</div><div class="sub">${m.sub}</div></div><h3>${m.name}</h3><p>${m.cat} • 2024</p><div class="btns"><button onclick="play(${i})">▶ Nonton</button><button class="s" onclick="share('${m.name}')">↗</button></div></div>`})}function filterFilms(){let s=document.getElementById('search').value.toLowerCase();let d=films.filter(x=>x.name.toLowerCase().includes(s));if(curCat!='all')d=d.filter(x=>x.cat==curCat);render(d)}function filterCat(c,b){curCat=c;document.querySelectorAll('.cats button').forEach(e=>e.classList.remove('active'));b.classList.add('active');filterFilms()}function play(i){let m=films[i];document.getElementById('pTitle').innerText=m.name;document.getElementById('player').style.display='block';document.getElementById('frame').src='https://www.youtube-nocookie.com/embed/'+m.yt+'?autoplay=1&rel=0&modestbranding=1&playsinline=1'}function closePlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').src=''}function share(n){window.open('https://wa.me/?text='+encodeURIComponent('Nonton '+n+' di https://iwan82.github.io/GigogFlix/'))}render(films)</script></body></html>
