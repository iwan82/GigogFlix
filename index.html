<!DOCTYPE html><html><head><title>GigogFlix by iis-gigog</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;margin:0}.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{font-size:26px;font-weight:900;background:linear-gradient(90deg,#FFD700,#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.search{padding:8px 12px;border-radius:20px;border:none;background:#222;color:#fff;width:130px}.hero{text-align:center;padding:20px}.hero h1{color:#e50914;font-size:32px;margin:0}.hero p{color:#aaa;font-size:12px}.cats{display:flex;gap:8px;overflow:auto;padding:12px 15px}.cats button{background:#222;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:12px}.cats button.active{background:#e50914}.movies{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.movie{background:#1a1a1a;border-radius:10px;overflow:hidden}.movie img{width:100%;height:190px;object-fit:cover}.movie h3{font-size:11px;margin:7px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movie p{font-size:10px;color:#888;margin:0 5px 6px}.movie.btns{display:flex;gap:5px;padding:0 5px 8px}.movie.btns button{flex:1;background:#e50914;color:#fff;border:none;padding:7px;border-radius:5px;font-size:11px;font-weight:bold}.movie.btns button.share{background:#333}#player{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99}#player iframe{width:100%;height:80%;margin-top:50px}#player.top{position:absolute;top:0;left:0;width:100%;background:#111;padding:12px;display:flex;justify-content:space-between}#player.top button{background:#e50914;color:#fff;border:none;padding:7px 14px;border-radius:5px}.footer{text-align:center;padding:25px;color:#555;font-size:11px}</style></head><body><div class="header"><div class="logo">GIGOGFLIX</div><input id="search" class="search" placeholder="Cari film..." onkeyup="filterFilms()"></div><div class="hero"><h1>Nonton Gratis</h1><p>Film Bioskop Terbaru - Tanpa Iklan - by iis-gigog</p></div><div class="cats"><button class="active" onclick="filterCat('all',this)">Semua</button><button onclick="filterCat('Action',this)">Action</button><button onclick="filterCat('Horror',this)">Horror</button><button onclick="filterCat('Comedy',this)">Comedy</button><button onclick="filterCat('Drama',this)">Drama</button></div><div class="movies" id="movies"></div><div id="player"><div class="top"><b id="pTitle">Now Playing</b><button onclick="closePlayer()">✕ Tutup</button></div><iframe id="frame" frameborder="0" allowfullscreen></iframe></div><div class="footer">© 2026 GigogFlix - by iis-gigog<br>Made with ❤️ di Cianjur - Semua Film Tersedia!</div><script>let films=[{name:"Avengers Endgame",cat:"Action",year:"2019",yt:"TcMBFSGVi1c",img:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg"},{name:"John Wick 4",cat:"Action",year:"2023",yt:"qEVU3r4ESUs",img:"https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg"},{name:"Spider-Man No Way Home",cat:"Action",year:"2021",yt:"JfVOs4VSpmA",img:"https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg"},{name:"The Batman",cat:"Action",year:"2022",yt:"mqqft2x_Aa4",img:"https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg"},{name:"Top Gun Maverick",cat:"Action",year:"2022",yt:"giXcoZzqZyI",img:"https://image.tmdb.org/t/p/w500/62HCnUTziyWcpDaBO2iHOMqAcUv.jpg"},{name:"Fast X",cat:"Action",year:"2023",yt:"aOb15GVF60c",img:"https://image.tmdb.org/t/p/w500/fiVW06jE7z9YnO4trhaMEdclSiC.jpg"},{name:"KKN Desa Penari",cat:"Horror",year:"2022",yt:"EMo0aZzZDzE",img:"https://image.tmdb.org/t/p/w500/k4x2z3x2X4p.jpg"},{name:"Pengabdi Setan 2 Communion",cat:"Horror",year:"2022",yt:"uW4h5qi2x6Y",img:"https://image.tmdb.org/t/p/w500/5d3v6E.jpg"},{name:"The Conjuring 2",cat:"Horror",year:"2016",yt:"VFsmuRP6qjw",img:"https://image.tmdb.org/t/p/w500/wVYREutTvI2tmxr6ujrHT704wGF.jpg"},{name:"Sewu Dino",cat:"Horror",year:"2023",yt:"l9R0u2v0v0I",img:"https://image.tmdb.org/t/p/w500/7.jpg"},{name:"Agak Laen",cat:"Comedy",year:"2024",yt:"w4R0a5y5y5I",img:"https://image.tmdb.org/t/p/w500/8.jpg"},{name:"Cek Toko Sebelah 2",cat:"Comedy",year:"2022",yt:"2vK2v0v0I",img:"https://image.tmdb.org/t/p/w500/9.jpg"},{name:"Miracle in Cell No 7",cat:"Drama",year:"2022",yt:"t0Q2v0v0I",img:"https://image.tmdb.org/t/p/w500/10.jpg"},{name:"Dilan 1990",cat:"Drama",year:"2018",yt:"3J6R0v0v0I",img:"https://image.tmdb.org/t/p/w500/11.jpg"},{name:"Habibie & Ainun 3",cat:"Drama",year:"2019",yt:"a5y5y5I",img:"https://image.tmdb.org/t/p/w500/12.jpg"},{name:"The Raid",cat:"Action",year:"2011",yt:"M1BnExjM6ko",img:"https://image.tmdb.org/t/p/w500/a.jpg"},{name:"Warkop DKI Reborn",cat:"Comedy",year:"2016",yt:"Qv0v0I",img:"https://image.tmdb.org/t/p/w500/b.jpg"},{name:"Danur 3",cat:"Horror",year:"2019",yt:"h5y5I",img:"https://image.tmdb.org/t/p/w500/c.jpg"},{name:"Laskar Pelangi",cat:"Drama",year:"2008",yt:"j5y5y5I",img:"https://image.tmdb.org/t/p/w500/d.jpg"},{name:"Gundala",cat:"Action",year:"2019",yt:"TcMBFSGVi1c",img:"https://image.tmdb.org/t/p/w500/e.jpg"}];let curCat='all';function render(f){let h=document.getElementById('movies');h.innerHTML='';f.forEach(m=>{let idx=films.indexOf(m);h.innerHTML+=`<div class="movie"><img src="${m.img}" onerror="this.src='https://via.placeholder.com/300x450/222/FFD700?text=${encodeURIComponent(m.name)}'"><h3>${m.name}</h3><p>${m.cat} • ${m.year}</p><div class="btns"><button onclick="play(${idx})">▶ Nonton</button><button class="share" onclick="share('${m.name}')">↗</button></div></div>`})}function filterFilms(){let s=document.getElementById('search').value.toLowerCase();let d=films.filter(x=>x.name.toLowerCase().includes(s));if(curCat!='all')d=d.filter(x=>x.cat==curCat);render(d)}function filterCat(c,b){curCat=c;document.querySelectorAll('.cats button').forEach(e=>e.classList.remove('active'));b.classList.add('active');filterFilms()}function play(i){let m=films[i];document.getElementById('pTitle').innerText=m.name;document.getElementById('player').style.display='block';document.getElementById('frame').src='https://www.youtube.com/embed/'+m.yt+'?autoplay=1&rel=0'}function closePlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').src=''}function share(n){let url='https://iwan82.github.io/GigogFlix/';window.open('https://wa.me/?text='+encodeURIComponent('Nonton '+n+' Gratis di GigogFlix by iis-gigog '+url))}render(films)</script></body></html>
