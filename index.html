<!DOCTYPE html><html><head><title>GigogFlix by iis-gigog</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;margin:0}.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.logo{font-size:26px;font-weight:900;color:#FFD700}.search{padding:8px 12px;border-radius:20px;border:none;background:#222;color:#fff;width:120px}.hero{text-align:center;padding:20px}.hero h1{color:#e50914;font-size:28px;margin:0}.hero p{color:#aaa;font-size:12px}.cats{display:flex;gap:8px;overflow:auto;padding:12px}.cats button{background:#222;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:12px}.cats button.active{background:#e50914}.movies{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.movie{background:#1a1a1a;border-radius:10px;overflow:hidden}.movie img{width:100%;height:190px;object-fit:cover}.movie h3{font-size:11px;margin:7px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movie p{font-size:10px;color:#888;margin:0 5px 6px}.btns{display:flex;gap:5px;padding:0 5px 8px}.btns button{flex:1;background:#e50914;color:#fff;border:none;padding:8px;border-radius:5px;font-size:11px;font-weight:bold}.btns button.s{background:#333}#player{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999}#player iframe{width:100%;height:85%;margin-top:50px;border:none}#player.top{position:absolute;top:0;left:0;width:100%;background:#111;padding:12px;display:flex;justify-content:space-between;box-sizing:border-box}.footer{text-align:center;padding:25px;color:#555;font-size:11px}</style></head><body><div class="header"><div class="logo">GIGOGFLIX</div><input id="search" class="search" placeholder="Cari..." onkeyup="filterFilms()"></div><div class="hero"><h1>Nonton Gratis</h1><p>by iis-gigog - Semua Film Dijamin Muter!</p></div><div class="cats"><button class="active" onclick="filterCat('all',this)">Semua</button><button onclick="filterCat('Action',this)">Action</button><button onclick="filterCat('Horror',this)">Horror</button><button onclick="filterCat('Comedy',this)">Comedy</button><button onclick="filterCat('Drama',this)">Drama</button></div><div class="movies" id="movies"></div><div id="player"><div class="top"><b id="pTitle"></b><button onclick="closePlayer()" style="background:#e50914;color:#fff;border:none;padding:6px 12px;border-radius:5px">✕ Tutup</button></div><iframe id="frame" allowfullscreen></iframe></div><div class="footer">© 2026 GigogFlix - by iis-gigog - V6 Anti Blokir</div><script>let films=[{name:"Avengers Endgame",cat:"Action",yt:"TcMBFSGVi1c"},{name:"John Wick 4",cat:"Action",yt:"qEVU3r4ESUs"},{name:"Spider-Man No Way Home",cat:"Action",yt:"JfVOs4VSpmA"},{name:"The Batman",cat:"Action",yt:"mqqft2x_Aa4"},{name:"Top Gun Maverick",cat:"Action",yt:"TcMBFSGVi1c"},{name:"Fast X",cat:"Action",yt:"qEVU3r4ESUs"},{name:"KKN Desa Penari",cat:"Horror",yt:"JfVOs4VSpmA"},{name:"Pengabdi Setan 2",cat:"Horror",yt:"mqqft2x_Aa4"},{name:"The Conjuring 2",cat:"Horror",yt:"TcMBFSGVi1c"},{name:"Sewu Dino",cat:"Horror",yt:"qEVU3r4ESUs"},{name:"Agak Laen",cat:"Comedy",yt:"JfVOs4VSpmA"},{name:"Cek Toko Sebelah",cat:"Comedy",yt:"mqqft2x_Aa4"},{name:"Miracle Cell No 7",cat:"Drama",yt:"TcMBFSGVi1c"},{name:"Dilan 1990",cat:"Drama",yt:"qEVU3r4ESUs"},{name:"Habibie Ainun",cat:"Drama",yt:"JfVOs4VSpmA"},{name:"The Raid",cat:"Action",yt:"mqqft2x_Aa4"},{name:"Warkop DKI",cat:"Comedy",yt:"TcMBFSGVi1c"},{name:"Danur",cat:"Horror",yt:"qEVU3r4ESUs"},{name:"Laskar Pelangi",cat:"Drama",yt:"JfVOs4VSpmA"},{name:"Gundala",cat:"Action",yt:"mqqft2x_Aa4"}];function render(f){let h=document.getElementById('movies');h.innerHTML='';f.forEach(m=>{let i=films.indexOf(m);h.innerHTML+=`<div class="movie"><img src="https://via.placeholder.com/300x450/222/FFD700?text=${encodeURIComponent(m.name)}"><h3>${m.name}</h3><p>${m.cat} • 2024</p><div class="btns"><button onclick="play(${i})">▶ Nonton</button><button class="s" onclick="share('${m.name}')">↗</button></div></div>`})}function filterFilms(){let s=document.getElementById('search').value.toLowerCase();let d=films.filter(x=>x.name.toLowerCase().includes(s));if(curCat!='all')d=d.filter(x=>x.cat==curCat);render(d)}let curCat='all';function filterCat(c,b){curCat=c;document.querySelectorAll('.cats button').forEach(e=>e.classList.remove('active'));b.classList.add('active');filterFilms()}function play(i){let m=films[i];document.getElementById('pTitle').innerText=m.name;document.getElementById('player').style.display='block';document.getElementById('frame').src='https://www.youtube.com/embed/'+m.yt+'?autoplay=1&rel=0&modestbranding=1'}function closePlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').src=''}function share(n){window.open('https://wa.me/?text='+encodeURIComponent('Nonton '+n+' Gratis di https://iwan82.github.io/GigogFlix/ by iis-gigog'))}render(films)</script></body></html>
