<!DOCTYPE html><html><head><title>GigogFlix by iis-gigog</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;font-family:Arial;margin:0}.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{font-size:26px;font-weight:900;color:#FFD700}.search{padding:8px 12px;border-radius:20px;border:none;background:#222;color:#fff;width:120px}.hero{text-align:center;padding:20px}.hero h1{color:#e50914;font-size:28px;margin:0}.hero p{color:#aaa;font-size:12px}.cats{display:flex;gap:8px;overflow:auto;padding:12px}.cats button{background:#222;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:12px;white-space:nowrap}.cats button.active{background:#e50914}.movies{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.movie{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #222}.poster{width:100%;height:210px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;text-align:center;padding:10px;box-sizing:border-box;line-height:1.2}.movie h3{font-size:12px;margin:8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movie p{font-size:10px;color:#888;margin:0 6px 6px}.btns{display:flex;gap:5px;padding:0 6px 8px}.btns button{flex:1;background:#e50914;color:#fff;border:none;padding:9px;border-radius:6px;font-size:12px;font-weight:bold}.btns button.s{background:#333}#player{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:999}#player iframe{width:100%;height:85%;margin-top:50px;border:none}.top{position:absolute;top:0;left:0;width:100%;background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;box-sizing:border-box}.footer{text-align:center;padding:25px;color:#555;font-size:11px}</style></head><body><div class="header"><div class="logo">GIGOGFLIX</div><input id="search" class="search" placeholder="Cari..." onkeyup="filterFilms()"></div><div class="hero"><h1>Nonton Gratis</h1><p>by iis-gigog - Dijamin 100% Muter!</p></div><div class="cats"><button class="active" onclick="filterCat('all',this)">Semua</button><button onclick="filterCat('Action',this)">Action</button><button onclick="filterCat('Horror',this)">Horror</button><button onclick="filterCat('Comedy',this)">Comedy</button><button onclick="filterCat('Drama',this)">Drama</button></div><div class="movies" id="movies"></div><div id="player"><div class="top"><b id="pTitle"></b><button onclick="closePlayer()" style="background:#e50914;color:#fff;border:none;padding:6px 12px;border-radius:5px">✕ Tutup</button></div><iframe id="frame" allowfullscreen></iframe></div><div class="footer">© 2026 GigogFlix by iis-gigog - V8 Anti Gagal</div><script>let films=[{name:"Avengers Endgame",cat:"Action",yt:"TcMBFSGVi1c",bg:"linear-gradient(135deg,#FF0000,#990000)",c:"#fff"},{name:"John Wick 4",cat:"Action",yt:"qEVU3r4ESUs",bg:"#222",c:"#FFD700"},{name:"Spider-Man No Way Home",cat:"Action",yt:"JfVOs4VSpmA",bg:"linear-gradient(135deg,#CC0000,#000066)",c:"#fff"},{name:"The Batman",cat:"Action",yt:"mqqft2x_Aa4",bg:"#111",c:"#FFD700"},{name:"Top Gun Maverick",cat:"Action",yt:"TcMBFSGVi1c",bg:"linear-gradient(135deg,#FF6600,#CC0000)",c:"#fff"},{name:"Fast X",cat:"Action",yt:"qEVU3r4ESUs",bg:"#333",c:"#fff"},{name:"KKN Desa Penari",cat:"Horror",yt:"JfVOs4VSpmA",bg:"#000",c:"#FF0000"},{name:"Pengabdi Setan 2",cat:"Horror",yt:"mqqft2x_Aa4",bg:"linear-gradient(135deg,#000,#330000)",c:"#fff"},{name:"The Conjuring 2",cat:"Horror",yt:"TcMBFSGVi1c",bg:"#111",c:"#fff"},{name:"Sewu Dino",cat:"Horror",yt:"qEVU3r4ESUs",bg:"#220000",c:"#FF0000"},{name:"Agak Laen",cat:"Comedy",yt:"JfVOs4VSpmA",bg:"linear-gradient(135deg,#FFD700,#FFAA00)",c:"#000"},{name:"Cek Toko Sebelah",cat:"Comedy",yt:"mqqft2x_Aa4",bg:"#FFCC00",c:"#000"},{name:"Miracle Cell No 7",cat:"Drama",yt:"TcMBFSGVi1c",bg:"linear-gradient(135deg,#0066FF,#00CCFF)",c:"#fff"},{name:"Dilan 1990",cat:"Drama",yt:"qEVU3r4ESUs",bg:"#6600FF",c:"#fff"},{name:"Habibie Ainun",cat:"Drama",yt:"JfVOs4VSpmA",bg:"linear-gradient(135deg,#FF0066,#FF6600)",c:"#fff"},{name:"The Raid",cat:"Action",yt:"mqqft2x_Aa4",bg:"#CC0000",c:"#fff"},{name:"Warkop DKI",cat:"Comedy",yt:"TcMBFSGVi1c",bg:"#FFD700",c:"#000"},{name:"Danur",cat:"Horror",yt:"qEVU3r4ESUs",bg:"#000",c:"#fff"},{name:"Laskar Pelangi",cat:"Drama",yt:"JfVOs4VSpmA",bg:"#00AA66",c:"#fff"},{name:"Gundala",cat:"Action",yt:"mqqft2x_Aa4",bg:"linear-gradient(135deg,#FF0000,#000)",c:"#fff"}];let curCat='all';function render(f){let h=document.getElementById('movies');h.innerHTML='';f.forEach(m=>{let i=films.indexOf(m);h.innerHTML+=`<div class="movie"><div class="poster" style="background:${m.bg};color:${m.c}">${m.name}</div><h3>${m.name}</h3><p>${m.cat} • 2024</p><div class="btns"><button onclick="play(${i})">▶ Nonton</button><button class="s" onclick="share('${m.name}')">↗</button></div></div>`})}function filterFilms(){let s=document.getElementById('search').value.toLowerCase();let d=films.filter(x=>x.name.toLowerCase().includes(s));if(curCat!='all')d=d.filter(x=>x.cat==curCat);render(d)}function filterCat(c,b){curCat=c;document.querySelectorAll('.cats button').forEach(e=>e.classList.remove('active'));b.classList.add('active');filterFilms()}function play(i){let m=films[i];document.getElementById('pTitle').innerText=m.name;document.getElementById('player').style.display='block';document.getElementById('frame').src='https://www.youtube.com/embed/'+m.yt+'?autoplay=1'}function closePlayer(){document.getElementById('player').style.display='none';document.getElementById('frame').src=''}function share(n){window.open('https://wa.me/?text='+encodeURIComponent('Nonton '+n+' Gratis di https://iwan82.github.io/GigogFlix/ by iis-gigog'))}render(films)</script></body></html>
